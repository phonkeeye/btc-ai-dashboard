<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC AI量化终端</title>
<style>
body {
  margin: 0;
  padding: 18px;
  background: #101827;
  color: #fff;
  font-family: Arial, sans-serif;
}
h1 {
  color: #f0b90b;
  font-size: 24px;
}
.card {
  background: #1d293b;
  padding: 18px;
  border-radius: 12px;
  margin: 14px 0;
}
.label {
  color: #9caec5;
  font-size: 14px;
}
.value {
  font-size: 25px;
  font-weight: bold;
  margin-top: 8px;
  word-break: break-word;
}
.small {
  font-size: 13px;
  color: #9caec5;
  line-height: 1.8;
  word-break: break-word;
}
.positive {
  color: #20d69a;
}
.negative {
  color: #ff6262;
}
button {
  background: #f0b90b;
  color: #101827;
  border: 0;
  padding: 12px 20px;
  border-radius: 8px;
  font-weight: bold;
  margin-top: 12px;
}
</style>
</head>
<body>
<h1>₿ BTC AI量化终端</h1>
<p class="small">实时行情 · 多周期分析 · AI观察 · 模拟交易</p>
<div class="card">
  <div class="label">BTC 实时价格（OKX）</div>
  <div class="value" id="price">正在连接行情...</div>
  <div class="small" id="liveTime">等待实时行情...</div>
  <div class="small" id="btcStats">等待24小时数据...</div>
</div>
<div class="card">
  <div class="label">ETH 实时价格（OKX）</div>
  <div class="value" id="ethPrice">正在连接行情...</div>
  <div class="small" id="ethTime">等待实时行情...</div>
  <div class="small" id="ethStats">等待24小时数据...</div>
</div>
<div class="card">
  <div class="label">SOL 实时价格（OKX）</div>
  <div class="value" id="solPrice">正在连接行情...</div>
  <div class="small" id="solTime">等待实时行情...</div>
  <div class="small" id="solStats">等待24小时数据...</div>
</div>
<div class="card">
  <div class="label">AI观察信号</div>
  <div class="value" id="signal">等待数据</div>
</div>
<div class="card">
  <div class="label">多空评分</div>
  <div class="value" id="score">等待数据</div>
  <div class="small" id="difference"></div>
</div>
<div class="card">
  <div class="label">15分钟分析</div>
  <div class="small" id="m15">等待数据</div>
</div>
<div class="card">
  <div class="label">1小时分析</div>
  <div class="small" id="h1">等待数据</div>
</div>
<div class="card">
  <div class="label">4小时分析</div>
  <div class="small" id="h4">等待数据</div>
</div>
<div class="card">
  <div class="label">资金费率</div>
  <div class="value" id="funding">--</div>
  <div class="label" style="margin-top:16px">持仓量</div>
  <div class="value" id="oi">--</div>
</div>
<div class="card">
  <div class="label">AI分析数据更新时间</div>
  <div class="small" id="updated">等待数据</div>
  <div class="small" id="status">正在读取系统数据...</div>
  <button onclick="loadData()">刷新AI分析</button>
</div>
<script>
// OKX 行情接口
const OKX_URL =
  'https://www.okx.com/api/v5/market/ticker?instId=BTC-USDT-SWAP';
const ETH_URL =
  'https://www.okx.com/api/v5/market/ticker?instId=ETH-USDT-SWAP';
const SOL_URL =
  'https://www.okx.com/api/v5/market/ticker?instId=SOL-USDT-SWAP';
let loadingLive = false;
let loadingAltLive = false;
let loadingHistory = false;
// 格式化价格
function formatPrice(value) {
  return '$' + Number(value).toLocaleString('en-US', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}
// 显示24小时行情统计
function showStats(ticker, elementId) {
  const element = document.getElementById(elementId);
  const last = Number(ticker.last);
  const open = Number(ticker.open24h);
  const high = Number(ticker.high24h);
  const low = Number(ticker.low24h);
  if (
    !Number.isFinite(last) ||
    !Number.isFinite(open) ||
    !Number.isFinite(high) ||
    !Number.isFinite(low) ||
    open <= 0
  ) {
    element.textContent = '24小时统计数据暂不可用';
    return;
  }
  const change = ((last - open) / open) * 100;
  const sign = change > 0 ? '+' : '';
  element.textContent =
    '24小时涨跌：' + sign + change.toFixed(2) + '%' +
    ' | 最高：' + formatPrice(high) +
    ' | 最低：' + formatPrice(low);
  element.className =
    'small ' + (change >= 0 ? 'positive' : 'negative');
}
// 获取 BTC 实时行情
async function updateLivePrice() {
  if (loadingLive) return;
  loadingLive = true;
  try {
    const response = await fetch(
      OKX_URL + '&t=' + Date.now(),
      { cache: 'no-store' }
    );
    if (!response.ok) {
      throw new Error('OKX接口请求失败：' + response.status);
    }
    const result = await response.json();
    if (
      result.code !== '0' ||
      !result.data ||
      !result.data.length
    ) {
      throw new Error('OKX没有返回有效行情');
    }
    const ticker = result.data[0];
    document.getElementById('price').textContent =
      formatPrice(ticker.last);
    document.getElementById('liveTime').textContent =
      '实时行情更新时间：' + new Date().toLocaleString();
    showStats(ticker, 'btcStats');
  } catch (error) {
    document.getElementById('liveTime').textContent =
      '实时行情获取失败：' + error.message;
    console.log(error);
  } finally {
    loadingLive = false;
  }
}
// 获取 ETH 和 SOL 实时行情
async function updateAltPrices() {
  if (loadingAltLive) return;
  loadingAltLive = true;
  async function updateOne(url, priceId, timeId, statsId) {
    try {
      const response = await fetch(
        url + '&t=' + Date.now(),
        { cache: 'no-store' }
      );
      if (!response.ok) {
        throw new Error('接口请求失败：' + response.status);
      }
      const result = await response.json();
      if (
        result.code !== '0' ||
        !result.data ||
        !result.data.length
      ) {
        throw new Error('没有返回有效行情');
      }
      const ticker = result.data[0];
      document.getElementById(priceId).textContent =
        formatPrice(ticker.last);
      document.getElementById(timeId).textContent =
        '实时行情更新时间：' + new Date().toLocaleString();
      showStats(ticker, statsId);
    } catch (error) {
      document.getElementById(timeId).textContent =
        '行情获取失败：' + error.message;
      console.log(error);
    }
  }
  try {
    await Promise.all([
      updateOne(ETH_URL, 'ethPrice', 'ethTime', 'ethStats'),
      updateOne(SOL_URL, 'solPrice', 'solTime', 'solStats')
    ]);
  } finally {
    loadingAltLive = false;
  }
}
// 显示周期分析
function showPeriod(id, analysis, key) {
  const item = analysis[key];
  const element = document.getElementById(id);
  if (!item) {
    element.textContent = '暂无数据';
    return;
  }
  element.textContent =
    '趋势：' + (item.trend ?? '--') +
    ' | RSI：' + (item.rsi14 ?? '--') +
    ' | EMA20：' + (item.ema20 ?? '--') +
    ' | EMA50：' + (item.ema50 ?? '--') +
    ' | 强度：' + (item.trend_strength ?? '--');
}
// 获取 GitHub 历史分析数据
async function loadData() {
  if (loadingHistory) return;
  loadingHistory = true;
  const status = document.getElementById('status');
  status.textContent = '正在读取AI分析数据...';
  try {
    const response = await fetch(
      './data/btc_history.jsonl?t=' + Date.now(),
      { cache: 'no-store' }
    );
    if (!response.ok) {
      throw new Error('历史数据读取失败：' + response.status);
    }
    const text = await response.text();
    const lines = text.trim().split('\n').filter(Boolean);
    if (!lines.length) {
      throw new Error('历史数据文件为空');
    }
    const data = JSON.parse(lines[lines.length - 1]);
    const analysis = data.analysis || {};
    document.getElementById('signal').textContent =
      data.signal ?? '等待分析';
    document.getElementById('score').textContent =
      '多头 ' + (data.long_score ?? '--') +
      ' / 空头 ' + (data.short_score ?? '--');
    document.getElementById('difference').textContent =
      '分数差：' + (data.score_difference ?? '--');
    showPeriod('m15', analysis, '15m');
    showPeriod('h1', analysis, '1H');
    showPeriod('h4', analysis, '4H');
    document.getElementById('funding').textContent =
      data.funding_rate ?? '--';
    document.getElementById('oi').textContent =
      data.open_interest ?? '--';
    document.getElementById('updated').textContent =
      data.timestamp ?? data.time ?? '暂无更新时间';
    status.textContent =
      'AI数据读取成功，共 ' + lines.length + ' 条历史记录';
  } catch (error) {
    status.textContent =
      'AI数据读取失败：' + error.message;
    console.log(error);
  } finally {
    loadingHistory = false;
  }
}
// 页面打开后立即执行
updateLivePrice();
updateAltPrices();
loadData();
// BTC、ETH、SOL 实时行情每3秒更新
setInterval(updateLivePrice, 3000);
setInterval(updateAltPrices, 3000);
// AI分析每60秒更新
setInterval(loadData, 60000);
</script>
</body>
</html>
