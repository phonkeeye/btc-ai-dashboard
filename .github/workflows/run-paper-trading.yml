name: Run Paper Trading

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-trading:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run historical candle check
        run: python paper_trading.py
